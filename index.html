<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baliq Ovi Lokatsiya Mini App</title>
    <!-- Telegram Web App skriptini ulash -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .container {
            text-align: center;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--tg-theme-link-color, #2481cc);
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .btn:active {
            opacity: 0.8;
        }

        .user-info {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            padding: 10px;
            background-color: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎣 Baliq Ovi Lokatsiyasi</h1>
        <p>Telegram Mini App-ga xush kelibsiz! Bu yerda tez orada daryolar, ko'llar va baliq ovlash joylari koordinatalarini ko'rishingiz mumkin bo'ladi.</p>
        
        <!-- Foydalanuvchi ismi chiqadigan joy -->
        <div id="username" class="user-info">Yuklanmoqda...</div>
        
        <br>
        <button class="btn" id="mainButton">Salom berish</button>
    </div>

    <script>
        // Telegram Mini App API-ni faollashtirish
        const tg = window.Telegram.WebApp;
        
        // Ilovani to'liq ekranga moslashtirish va tayyor holatga keltirish
        tg.ready();
        tg.expand();

        // Kirgan foydalanuvchining ma'lumotlarini olish
        const user = tg.initDataUnsafe?.user;
        const usernameBlock = document.getElementById('username');

        if (user) {
            usernameBlock.innerText = `Xush kelibsiz, ${user.first_name} ${user.last_name || ''}!`;
        } else {
            usernameBlock.innerText = "Foydalanuvchi ma'lumoti aniqlanmadi (Telegramdan kiring).";
        }

        // Tugma bosilganda bildirishnoma ko'rsatish
        document.getElementById('mainButton').addEventListener('click', () => {
            tg.showAlert(`Assalomu alaykum ${user ? user.first_name : 'Foydalanuvchi'}! Baza muvaffaqiyatli ulanishga tayyor.`);
        });
    </script>
</body>
</html>
